<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="editor-token" content="__EDITOR_TOKEN__"><meta name="site-base" content="__BASE__"><meta name="current-user" content="__USER__"><title>استودیوی طراحی فرا</title><link rel="stylesheet" href="__BASE__/fara-admin/studio.css"><link rel="stylesheet" href="__BASE__/fara-admin/account.css"></head><body>
<aside class="sidebar"><a class="brand" href="__BASE__/fara-admin/"><img src="__BASE__/assets/logo.png" alt="فرا"><b>استودیوی فرا<small>طراحی و محتوای عمومی سایت</small></b></a><button data-view="pages">▤ صفحه‌ها و محتوا</button><button data-view="menu">☷ منوی سایت</button><button data-view="media">▧ کتابخانهٔ رسانه</button><button data-view="shared">◈ سربرگ و پابرگ</button><button data-view="patterns">▦ قالب‌ها و الگوها</button><button data-view="categories">⌘ حوزه‌های فعالیت</button><button data-view="permissions">♙ مجوزهای طراحان</button><button id="commands">⌕ جست‌وجوی فرمان‌ها <kbd>Ctrl K</kbd></button><div class="account-actions"><small id="account-name"></small><button id="manage-users">حساب‌های طراحی</button><button id="change-password">تغییر رمز</button><button id="logout">خروج</button></div><p class="aside-note">ذخیره، پیش‌نویس خصوصی می‌سازد.<br>انتشار، سایت عمومی را تغییر می‌دهد.</p></aside>
<div class="workspace"><header class="toolbar"><div><small>گروه بین‌المللی فرا / مدیریت طراحی</small><h1 id="heading">صفحه‌ها</h1></div><div class="actions"><button id="undo-local" title="واگرد">↶</button><button id="redo-local" title="انجام دوباره">↷</button><button id="save">ذخیرهٔ پیش‌نویس</button><button id="publish" class="primary">انتشار</button></div></header><p id="status" role="status" aria-live="polite">در حال بارگذاری…</p><div id="content"></div></div>
<dialog id="command-dialog"><h2>جست‌وجوی فرمان‌ها</h2><input id="command-search" type="search" placeholder="صفحه، رسانه، انتشار…" aria-label="جست‌وجوی فرمان"><div id="command-results"></div><button id="close-commands">بستن</button></dialog>
<dialog id="account-dialog" class="account-dialog"><header><h2 id="account-title"></h2><button id="close-account" type="button">بستن</button></header><section id="users-panel" hidden><p>حساب‌های این پنل مستقل از مشتریان هستند. طراح جدید تا تعیین مجوز، دسترسی محتوایی ندارد.</p><label>رمز فعلی مدیر<input id="admin-confirm" type="password" autocomplete="current-password"></label><h3>افزودن حساب</h3><form id="new-user"><label>نام کاربری<input name="username" dir="ltr" required pattern="[A-Za-z0-9_.-]{3,40}"></label><label>رمز موقت<input name="password" type="password" required minlength="12" autocomplete="new-password"></label><label>نقش<select name="role"><option value="editor">طراح با مجوز اختصاصی</option><option value="admin">مدیر</option></select></label><button type="submit">افزودن</button></form><div id="user-list"></div></section><section id="change-panel" hidden><form id="change-form"><label>رمز فعلی<input name="current" type="password" required autocomplete="current-password"></label><label>رمز جدید<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><label>تکرار رمز<input name="confirm" type="password" minlength="12" required autocomplete="new-password"></label><button>تغییر رمز</button></form></section><p id="account-message" role="status"></p></dialog>
<script src="__BASE__/fara-admin/account.js" defer></script><script src="__BASE__/fara-admin/studio.js" defer></script></body></html>
